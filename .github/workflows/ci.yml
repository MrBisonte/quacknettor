name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    # A pinned image, so the check does not change when ubuntu-latest moves.
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        # pip-audit scans pip and setuptools too, so both are upgraded here.
        python -m pip install --upgrade pip setuptools
        pip install -r requirements.txt
        
    - name: Run Ruff (Linting)
      run: ruff check .
      
    - name: Run Black (Formatting Check)
      run: black --check .
      
    - name: Run Pytest (unit; integration needs Docker/Snowflake)
      run: pytest -m "not integration"

    - name: Run pip-audit (Security Scan)
      run: pip-audit
      continue-on-error: true
